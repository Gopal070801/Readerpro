name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ReaderPro.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: unzip -q ReaderPro.zip -d work

      - name: Build APK
        working-directory: work/ReaderPro
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp work/ReaderPro/app/build/outputs/apk/debug/app-debug.apk ReaderPro.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Reader Pro v${{ github.run_number }}
          files: ReaderPro.apk
